{# register.html #}
{% extends "base.html" %}
{% block title %}注册 · 囤谷屋{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>创建账号</h1>
    <p class="sub">开启你的吃谷之旅</p>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input name="username" placeholder="用户名（3-32 位）" autocomplete="username"
             minlength="3" maxlength="32" required autofocus>
      <input name="password" type="password" placeholder="密码（至少 6 位）"
             autocomplete="new-password" minlength="6" maxlength="72" required>
      <button type="submit">注 册</button>
    </form>
    <a class="switch" href="{{ url_for('main.login') }}">已有账号？去登录</a>
  </div>
</div>
{% endblock %}
