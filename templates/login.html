{# login.html #}
{% extends "base.html" %}
{% block title %}登录 · 囤谷屋{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>囤谷屋</h1>
    <p class="sub">记录你的每一件谷子</p>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input name="username" placeholder="用户名" autocomplete="username"
             maxlength="32" required autofocus>
      <input name="password" type="password" placeholder="密码"
             autocomplete="current-password" required>
      <button type="submit">登 录</button>
    </form>
    <a class="switch" href="{{ url_for('main.register') }}">没有账号？去注册</a>
  </div>
</div>
{% endblock %}
