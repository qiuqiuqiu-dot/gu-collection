{% extends "base.html" %}
{% block title %}修改密码 · 囤谷屋{% endblock %}
{% block body %}
<div class="phone">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="screen">

    <header class="app-header">
      <div class="greet">
        <h1>修改密码</h1>
        <p>{{ current_user.username }} ✿</p>
      </div>
      <a class="back-btn" href="{{ url_for('main.account_page') }}"
         aria-label="返回账号与安全" title="返回账号与安全">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
        <span>返回</span>
      </a>
    </header>

    <section class="card set-card">
      <h3>改成新密码</h3>
      <p class="set-hint">
        需要先填当前密码，证明是你本人。改完其它设备上的登录会立刻失效，这台继续用。
      </p>
      <form method="post" action="{{ url_for('main.account_password') }}"
            id="passwordForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="up-field">
          <span>当前密码</span>
          <input type="password" name="old_password" id="oldPassword"
                 autocomplete="current-password" required>
        </label>
        <label class="up-field">
          <span>新密码（至少 {{ password_min }} 位）</span>
          <input type="password" name="new_password" id="newPassword"
                 autocomplete="new-password" required>
        </label>
        <label class="up-field">
          <span>再输一次新密码</span>
          <input type="password" name="confirm_password" id="confirmPassword"
                 autocomplete="new-password" required>
        </label>
        <button type="submit" class="set-btn primary" id="passwordBtn">改密码</button>
      </form>
    </section>

    <p class="set-warn">
      建议用一句话 + 数字的密码（比如「xiaoyu-2026-gu」），比 6 位短密码安全得多，
      而且记得住。忘了是找不回来的。
    </p>

  </div>
</div>
{% endblock %}
